/* 2.2.0: la vista principal es wallet-first; minería sólo ocupa una fila. */
.container{padding:20px 28px 22px}
.masthead{margin:4px 0 26px}

.activity-strip .dot{flex-shrink:0}

.activity-strip[data-phase="stale"]{color:#dfbf75}

/* v2.7 · estructura unificada, grafito neutral y controles discretos.
   El color de acento es funcional; no hay degradados ni sombras decorativas. */
:root{--bg:#101417;--panel:#1b2024;--surface:#242b2f;--surface2:#2b3439;
      --muted:#9daab1;--text:#e9edef;--line:#343e43;--green:#56c58d;
      --action:#278b65;--action-hover:#309b73;--amber:#dbb874;--red:#dd8a8c;--radius:13px}
html,body{background:var(--bg);color:var(--text)}
.container{max-width:1630px;padding:22px 29px 26px}
.masthead{margin:4px 2px 23px}.brand{font-size:25px;letter-spacing:-.65px}
.logo{background:#287e5f;border-radius:12px;box-shadow:none}
.pill{background:#1d2926;border-color:#3e6557;color:#b5dbc6}
.dot{background:var(--green);box-shadow:none}.dim-dot{background:#737f85;box-shadow:none}
.layout{grid-template-columns:minmax(320px,390px) minmax(0,1fr);align-items:stretch;gap:18px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none}
.miners-pane{min-height:612px;padding:18px 17px;display:flex;flex-direction:column}
.miners-title{margin:1px 1px 17px;font-size:17px;letter-spacing:-.2px}
.mining-cards{gap:10px}
.mining-card{background:#232a2e;border:1px solid #3a464b;border-radius:10px;padding:14px 13px 12px}
.mining-card.is-active{background:#24332e;border-color:#457764}
.mining-card-name{font-size:13px;font-weight:650;letter-spacing:0}
.mining-card-status{margin-top:10px;gap:9px}
.mining-card .small-gear{color:#a5b5bd;border:0;background:transparent}
.mining-card .small-gear:hover{background:#394248;color:#f3f6f7}
.mining-card .mine-toggle[aria-checked="false"]{background:#394349;border-color:#64747a}
.mining-card .mine-toggle[aria-checked="true"]{background:#258a62;border-color:#369e74}
.mining-card .mine-toggle .thumb{background:#e4e9e7}
.mining-card.is-active .mining-card-status .activity-message{color:#bddecf}
.mining-card-status .block-count{border-left-color:#465158;color:#dbe2e5}
.mining-card-event{display:none}
.mining-card-event[data-kind="found"]{color:#b7dcbc}

.wallet-dashboard{min-height:612px;display:flex;flex-direction:column;min-width:0}
.wallet-dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 24px;border-bottom:1px solid var(--line);min-height:79px}

  font-weight:700;letter-spacing:-.25px;margin:0;white-space:nowrap}

.wallet-dashboard-body{display:grid;grid-template-columns:minmax(205px,29%) minmax(0,1fr);flex:1;min-height:0}

 color:#cbd6d8;border-radius:9px;font-size:12px}

details{background:#242d31;border-color:#3f4c52}

/* v2.7.10 · Administrador de billeteras: cinco grupos colapsables, sin alterar formularios. */
.wallet-manager-section{margin:0 0 10px;background:#232c30;border:1px solid #465157;border-radius:10px;overflow:clip}
.wallet-manager-section>summary{padding:16px 17px;font-size:14px;color:var(--text)}

.wallet-manager-section>.details-body{padding:17px 17px 18px}

.wallet-manager-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.wallet-manager-item{display:flex;flex-direction:column;gap:4px;text-align:left;padding:11px 13px;width:100%;color:var(--text);background:#293338;border:1px solid #435158;border-radius:9px;cursor:pointer}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* QR de recepción generado localmente, sin servicios externos. */
.receive-qr-shell{display:flex;justify-content:center;margin:0 0 20px}
.receive-qr{background:#fff;padding:13px;border-radius:13px;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
.receive-qr img,.receive-qr canvas{display:block;width:204px;height:204px;image-rendering:pixelated}
.send-result-head{text-align:center;margin:12px auto 24px}
.send-result-icon{display:flex;justify-content:center;align-items:center;margin:0 auto 10px;width:54px;height:54px;border-radius:50%;border:2px solid var(--green);color:var(--green);font-size:27px;font-weight:700}
.send-result-icon.is-warning{border-color:var(--amber);color:var(--amber)}
.send-result-icon.is-error{border-color:var(--red);color:var(--red)}
.send-result-head h3{font-size:21px;margin:0 0 9px}
.send-result-head p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 auto;max-width:510px}
.send-result-amount{text-align:center;font-weight:700;font-size:27px;margin:0 0 20px}
.send-result-grid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px 13px;margin:16px 0}
.send-result-grid .key{color:var(--muted);font-size:12px}

.copy-txid-icon:hover{background:#405057}

/* v2.7.13.1: balance legible en pantallas pequeñas, estado por icono en vez de texto técnico. */
.wallet-balance-label{color:var(--muted);font-size:12px;margin-top:22px}
.wallet-balance-row{display:flex;align-items:center;gap:11px;min-width:0}
.wallet-balance-row .balance{margin:6px 0 0;min-width:0}

// Measure the real rendered text, then reduce only if it exceeds its available line.
// The balance elements must never become scroll containers.
function fitWalletBalances(){
 function fit(el,available){
  if(!el||available<=0||!el.getClientRects().length)return;
  el.style.fontSize='';
  const original=parseFloat(getComputedStyle(el).fontSize);
  if(!Number.isFinite(original))return;
  const range=document.createRange();range.selectNodeContents(el);
  const measured=range.getBoundingClientRect().width;
  range.detach?.();
  if(measured>available){el.style.fontSize=Math.max(9,Math.floor(original*(available-2)/measured))+'px';}
 }
 const row=$('balance')?.parentElement;
 if(row&&row.clientWidth){
  const badge=$('balanceStatus');
  const gap=parseFloat(getComputedStyle(row).columnGap)||11;
  fit($('balance'),row.clientWidth-(badge&&!badge.hidden?badge.offsetWidth+gap:0));
 }

   const running=!!m.mining;
   const showingEvent=running&&phase==='hashing'&&eventMessage&&eventId&&seenMinerEvents.get(net.key)!==eventId;
   if(showingEvent)seenMinerEvents.set(net.key,eventId);

     if(minerEventTimers.has(net.key))clearTimeout(minerEventTimers.get(net.key));

 if(!localeHydrated){
   CMI18n.hydrate(r.settings?.ui_language,r.settings?.number_format);
   CMFiat.hydrate(r.settings?.fiat_currency);
   localeHydrated=true;
 }

 if(seenMiningRun===null)seenMiningRun=r.mining_run;
 else if(r.mining_run!==seenMiningRun){
  seenMiningRun=r.mining_run;manuallySelectedLog=false;selectedMinerLog=null;
  minerLogStart=minerLogEnd=0;lastSearchOffset=null;logCachedView=null;
 }
 current=r;draw();
 if(r.network==='mainnet')CMFiat.refresh();
 const alert=$('minerStartupError');
 if(alert){alert.textContent=r.last_error?'Error de proceso: '+r.last_error:'';alert.classList.toggle('hidden',!r.last_error)}
}

function explorerTransactionUrl(network,txid){
 if(!/^[0-9a-f]{64}$/i.test(txid||''))return null;
 // Never open a mainnet explorer for a testnet transaction.
 const base={mainnet:'https://bchexplorer.cash/tx/',testnet3:'https://tbch.loping.net/tx/',
   testnet4:'https://tbch4.loping.net/tx/', chipnet:'https://chipnet.chaingraph.cash/tx/'}[network];
 return base?base+txid.toLowerCase():null;
}
function showSendResult(out){
 const state=['sent','rejected','uncertain'].includes(out.status)?out.status:'uncertain';
 const title=state==='sent'?'Transacción enviada':state==='rejected'?'El servidor rechazó el envío':'Resultado del envío incierto';
 const icon=state==='sent'?'✓':state==='rejected'?'×':'?';
 const extra=state==='sent'?'La transacción fue aceptada para difusión. Puede seguir sin confirmar.':
   (out.message||'El envío podría haberse difundido. No se reintentó automáticamente.');
 const network=out.network||current.network;
 const dest=out.destination||'';
 const txid=String(out.txid||'');
 const url=explorerTransactionUrl(network,txid);
 const txidHtml=url?`<a class="send-txid-link" id="openBroadcastTxid" href="${esc(url)}" title="Consultar transacción">${esc(txid)}</a>`:
   `<span class="send-txid-link">${esc(txid)}</span>`;
 const amount=CMI18n.formatSats(out.amount_sats,{min:8,max:8});
 const fee=CMI18n.formatSats(out.fee_sats,{min:8,max:8});
 modal(title,`<div class="send-result-head"><div class="send-result-icon ${state==='sent'?'':state==='rejected'?'is-error':'is-warning'}" aria-hidden="true">${icon}</div><h3>${esc(title)}</h3><p>${esc(extra)}</p></div>
 <div class="send-result-amount">${amount} ${coinUnit(network)}</div>${network==='mainnet'?`<div class="fiat-send-hint">${CMFiat.html(out.amount_sats,network)}</div>`:''}
 <div class="send-result-grid"><span class="key">Red</span><span class="value">${esc(current.network_label)}</span>
 <span class="key">Destinatario</span><span class="value inline-code">${esc(dest)}</span>
 <span class="key">Comisión</span><span class="value">${fee} ${coinUnit(network)} (${out.fee_sats} sats)</span>
 <span class="key">TXID</span><div class="send-txid-row">${txidHtml}<button type="button" class="copy-txid-icon" id="copyBroadcastTxid" aria-label="Copiar TXID" title="Copiar TXID"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div></div>
 ${out.warning?`<div class="notice">${esc(out.warning)}</div>`:''}
 <div class="btn-line"><button type="button" class="btn primary" id="sendResultDone">Volver a billetera</button></div>`);
 $('copyBroadcastTxid').onclick=()=>navigator.clipboard.writeText(txid).then(()=>notice('TXID copiado'),()=>notice('No se pudo copiar el TXID',true));
 const explorerLink=$('openBroadcastTxid');
 if(explorerLink)explorerLink.onclick=async event=>{
   event.preventDefault();
   try{await api('/api/external/transaction',{network,txid});}
   catch(error){notice('No se pudo abrir el explorador en el navegador predeterminado: '+error.message,true)}
 };
 $('sendResultDone').onclick=closeModal;
}

function prepareInlineSend(){return act(async()=>{
   const w=walletSelected();if(!w)throw Error('Elegí una billetera para enviar');
   if(w.scan_state!=='synced'||current.wallet_electrum?.status!=='conectado')throw Error('Primero sincronizá y conectá la billetera');
   const requestedNetwork=current.network, requestedWallet=w.id;
   const button=$('sendPrepare');button.disabled=true;
   let preview;
   try{preview=await api('/api/wallet/send/prepare',{id:w.id,destination:$('sendAddress').value.trim(),amount_bch:sendMaxMode?'':ensureFiatAmountPrepared(),fee_rate:CMI18n.normalizeInput($('sendFeeRate').value),send_max:sendMaxMode});}
   finally{button.disabled=!(current.network===requestedNetwork&&current.selected_wallet===requestedWallet);}
   if(current.network!==requestedNetwork||current.selected_wallet!==requestedWallet)throw Error('La red o la billetera cambió. Revisá de nuevo el envío');
   const amount=CMI18n.formatSats(preview.amount_sats,{min:8,max:8});
   const fee=CMI18n.formatSats(preview.fee_sats,{min:8,max:8});
   const fiatOrigin=sendUnitIsFiat()&&!sendMaxMode?{text:$('sendAmount').value,currency:sendFiatQuote?.currency,quote:sendFiatQuote,sats:sendFiatSats}:null;
   modal('Confirmar envío · '+current.network_label,`<div class="notice">Última revisión. Esta operación difundirá una transacción irreversible si es aceptada por la red. No requiere contraseña.</div><p>Destinatario</p><div class="inline-code" style="overflow-wrap:anywhere">${esc(preview.destination)}</div>${preview.send_max?'<p><strong>Enviar todo (MAX)</strong></p>':''}${fiatOrigin?`<p>${esc(CMI18n.t('Importe ingresado:'))} <strong>${esc(fiatOrigin.text)} ${esc(fiatOrigin.currency)}</strong>${CMFiat.quoteAge(fiatOrigin.quote).stale?` <span class="fiat-age" title="${esc(CMFiat.quoteAge(fiatOrigin.quote).info)}">◷ ${esc(CMFiat.quoteAge(fiatOrigin.quote).text)}</span>`:''}</p>`:''}<p>Importe: <strong>${amount} ${coinUnit(current.network)}</strong></p>${current.network==='mainnet'?`<p class="fiat-send-hint">${CMFiat.html(preview.amount_sats,current.network)}</p>`:''}<p>Comisión: <strong>${fee} ${coinUnit(current.network)} (${preview.fee_sats} sats)</strong></p><p>Cambio: ${CMI18n.formatSats(preview.change_sats,{min:8,max:8})} ${coinUnit(current.network)} · ${preview.inputs} entradas</p>${preview.skipped_count?`<p class="help-text">Quedan sin gastar ${preview.skipped_count} UTXO no rentables (${preview.skipped_sats} sats).</p>`:''}<p class="help-text">TXID previsto: ${esc(preview.txid)}</p><div class="btn-line"><button id="sendConfirm" class="btn primary">Transmitir ahora</button><button id="sendCancel" class="btn ghost">Cancelar</button></div>`);
   $('sendCancel').onclick=closeModal;
   $('sendConfirm').onclick=async()=>{
      // The confirmation is single-use: no retry, including after an error.
      $('sendConfirm').disabled=true;
      modal('Transmitiendo · '+current.network_label,`<div class="send-result-head"><div class="send-result-icon is-warning">…</div><h3>Enviando transacción</h3><p>Esperando la respuesta del servidor Electrum.</p></div>`);
      let out;
      try{
        out=await api('/api/wallet/send/broadcast',{id:w.id,token:preview.token});
      }catch(error){
        // A failed HTTP response is not proof that a network broadcast failed.
        // The signed transaction may already have reached Electrum.
        out={status:'uncertain',txid:preview.txid,network:current.network,
          destination:preview.destination,amount_sats:preview.amount_sats,fee_sats:preview.fee_sats,
          message:'CashMiner no pudo conocer el resultado del envío: '+error.message};
      }
      try{await refresh()}catch(error){console.warn('Actualización de billetera pendiente',error)}
      showSendResult(out);
   };
 });
}

function renderWalletSettingsState(c,w){
 const key=w?c.network+':'+w.id:null;
 // Changing wallet or network always returns to the regular screen.
 if(walletSettingsMode && walletSettingsKey && walletSettingsKey!==key){walletSettingsMode=false;walletSettingsKey=null;}
 const btn=$('walletSettingsToggle');btn.hidden=!w;
 btn.setAttribute('aria-pressed',String(Boolean(w&&walletSettingsMode)));
 btn.setAttribute('aria-label',walletSettingsMode?'Cerrar configuración de billetera':'Configurar billetera');
 btn.title=walletSettingsMode?'Volver a la billetera':'Configurar billetera';
 btn.firstElementChild.textContent=walletSettingsMode?'×':'⚙';
 $('walletNormalContent').hidden=Boolean(w&&walletSettingsMode);
 $('walletSettingsContent').hidden=!w||!walletSettingsMode;
 if(!w||!walletSettingsMode){
  if(walletSettingsKey!==null){walletSettingsKey=null;$('walletSettingsContent').replaceChildren();}
  return;
 }
 if(walletSettingsKey===key)return; // Don't erase edits on the periodic state refresh.
 walletSettingsKey=key;
 $('walletSettingsContent').innerHTML=walletIndividualSettingsContent(w);
 bindIndividualWalletActions(w,c.network,c.network_label);
}
function bindIndividualWalletActions(managedWallet,walletNet,walletNetLabel){
 const walletId=managedWallet.id;
 const assertWallet=()=>{
  if(!current||current.network!==walletNet||current.selected_wallet!==walletId||!walletSettingsMode)
   throw Error('Cambió la billetera. Abrí su configuración nuevamente');
 };
 $('renameWalletBtn').onclick=()=>act(async()=>{
  assertWallet();const name=$('renameWalletName').value.trim();
  if(!name||name.length>60)throw Error('Nombre de entre 1 y 60 caracteres');
  if(name===managedWallet.name){notice('Ese ya es el nombre de la billetera');return;}
  await api('/api/wallet/rename',{id:walletId,network:walletNet,name});
  walletSettingsKey=null;await refresh();notice('Billetera renombrada');
 });
 $('deleteWalletBtn').onclick=()=>act(async()=>{
  assertWallet();
  const answer=await askDecision('Eliminar billetera · '+managedWallet.name,
   'Se quitará de CashMiner la billetera '+managedWallet.name+' ('+walletNetLabel+'), incluyendo el secreto cifrado DPAPI y los registros locales. Los fondos no se mueven. La recuperación posterior requiere tu respaldo externo y la ruta de derivación '+(managedWallet.derivation_path||'Legacy')+'. Esta acción no se puede deshacer desde la aplicación.',
   {accept:'Eliminar definitivamente'});
  if(!answer)return;
  assertWallet();
  const result=await api('/api/wallet/delete',{id:walletId,network:walletNet,
       expected_name:managedWallet.name,expected_address:managedWallet.first_address});
  walletSettingsMode=false;walletSettingsKey=null;await refresh();
  notice(result.cleanup_warning||'Billetera eliminada localmente',Boolean(result.cleanup_warning));
 });
 $('recoveryBtn').onclick=()=>act(async()=>{
  assertWallet();
  const answer=await askDecision('Revelar secreto privado','El secreto aparecerá en pantalla. Evitá capturas, grabaciones y compartirlo.',{accept:'Mostrar'});
  if(!answer)return;
  assertWallet();
  const result=await api('/api/wallet/recovery',{id:walletId});showRecoverySeed(result);
 });

// v2.9: read the existing SQLite address cache, without deriving or scanning.
// Never recreate this panel during the periodic wallet-state redraw.
let walletAddressRequestId=0;
async function showWalletAddressPage(walletId,network,page,assertWallet){
 const panel=$('walletAddressesPanel'),body=$('walletAddressesBody');
 if(!panel||panel.hidden||!body)return;
 const requestId=++walletAddressRequestId;
 body.textContent='Cargando direcciones…';
 try{
  assertWallet();
  const params='id='+encodeURIComponent(walletId)+'&network='+encodeURIComponent(network)+'&page='+page;
  const data=await api('/api/wallet/addresses?'+params);
  if(requestId!==walletAddressRequestId||panel!==$('walletAddressesPanel')||panel.hidden)return;
  assertWallet();
  const rows=data.addresses||[];
  const satText=n=>CMI18n.formatBch(n,coinUnit(network),{min:0,max:8});
  const sections=[];
  let previousBranch=null;
  for(const a of rows){
   if(a.branch!==previousBranch){
    previousBranch=a.branch;
    sections.push('<h4 class="wallet-addresses-branch">'+(a.branch===0?'Recepción':'Cambio')+' · Rama '+a.branch+'</h4>');
   }
   const status=!a.status_known?'—':a.used?'Usada':a.issued?'Emitida':'Sin actividad';
   const money=a.total_sats===null?'—':satText(a.available_sats);
   const extra=a.total_sats!==null&&a.immature_sats>0?' · Inmaduro: '+satText(a.immature_sats):'';
   const token=a.total_sats!==null&&a.token_locked_sats>0?' · Tokens: '+satText(a.token_locked_sats):'';
   sections.push(`<div class="wallet-address-row"><div class="wallet-address-info"><div class="wallet-address-index">#${a.index} · ${esc(status)}</div><div class="wallet-address-value">${esc(a.address)}</div><div class="wallet-address-amount">${esc(money)}${esc(extra+token)}${a.total_sats!==null&&network==='mainnet'?` <span class="fiat-live" data-fiat-network="mainnet" data-fiat-sats="${esc(String(a.available_sats))}">${CMFiat.html(a.available_sats,network,'compact')}</span>`:''}</div></div><button class="btn ghost wallet-address-copy" type="button" data-address-copy="${esc(a.address)}" aria-label="Copiar dirección #${a.index}" title="Copiar dirección">⧉</button></div>`);
  }
  const prev=data.page>1;
  const next=data.page<data.pages;
  body.innerHTML=`<div class="wallet-addresses-summary">Recepción: ${data.counts.receive} · Cambio: ${data.counts.change} · Total: ${data.total}</div>`+
    (rows.length?'<div class="wallet-addresses-scroll">'+sections.join('')+'</div>':'<p class="help-text">Todavía no hay direcciones registradas.</p>')+
    `<div class="wallet-addresses-pager"><button id="walletAddressesPrev" class="btn ghost" ${prev?'':'disabled'}>Anterior</button><span>Página ${data.page} de ${data.pages}</span><button id="walletAddressesNext" class="btn ghost" ${next?'':'disabled'}>Siguiente</button></div>`;
  body.querySelectorAll('[data-address-copy]').forEach(button=>button.onclick=()=>act(async()=>{
   assertWallet();await navigator.clipboard.writeText(button.dataset.addressCopy);notice('Dirección copiada');
  }));
  $('walletAddressesPrev').onclick=()=>{if(prev)showWalletAddressPage(walletId,network,data.page-1,assertWallet)};
  $('walletAddressesNext').onclick=()=>{if(next)showWalletAddressPage(walletId,network,data.page+1,assertWallet)};
 }catch(error){
  if(requestId===walletAddressRequestId&&panel===$('walletAddressesPanel')&&!panel.hidden){
   body.textContent='No se pudo leer la lista local: '+error.message;
  }
 }
}

 function formatRewardPercentUnits(value){
   if(!/^(?:0|[1-9][0-9]{0,2})(?:\.[0-9]{1,4})?$/.test(value))return null;
   const p=value.split('.');return Number(p[0])*10000+Number((p[1]||'').padEnd(4,'0'));
 }
 function currentRewardAddress(r){
   if(r.type==='address')return r.address;
   const wallet=rewardWallets.find(w=>w.id===r.wallet_id);
   // Guardado = dirección anclada; una nueva selección utiliza la dirección minera actual.
   return r.address||(wallet?.mining_address||wallet?.address||'');
 }
 function shortenRewardWallet(el,name,address){
   if(!el)return;
   const width=el.clientWidth;
   if(width<=0)return;
   const ctx=document.createElement('canvas').getContext('2d');
   ctx.font=getComputedStyle(el).font;
   const fits=text=>ctx.measureText(text).width<=width-1;
   const original=name+' · '+address;
   if(fits(original)){el.textContent=original;return;}
   // El recorte se hace en el centro del CashAddr, nunca en el valor real.
   let start=0,end=address.length, prefix=name+' · ';
   let suffixLength=Math.min(8,Math.floor(address.length/2));
   const candidate=(n)=>prefix+address.slice(0,n)+'…'+address.slice(-suffixLength);
   if(!fits(candidate(0))){
      while(name.length>3&&!fits(name+'… · '+address.slice(0,2)+'…'+address.slice(-suffixLength)))name=name.slice(0,-1);
      prefix=name+'… · ';
      while(suffixLength>2&&!fits(candidate(0)))suffixLength--;
   }
   while(start<end){const mid=Math.ceil((start+end)/2);if(fits(candidate(mid)))start=mid;else end=mid-1;}
   el.textContent=candidate(start);
 }

     const row=rewardDraft.find(r=>String(r.localId)===el.dataset.rewardLabel);
     el.title=currentRewardAddress(row);
   });

   requestAnimationFrame(updateRewardLabels);
 }
 function pendingRewardPlan(){
   const plan=rewardDraft.map(r=>({type:r.type,wallet_id:r.type==='wallet'?r.wallet_id:undefined,address:currentRewardAddress(r),percent:r.percent}));
   const units=plan.map(r=>formatRewardPercentUnits(r.percent));
   if(units.some(v=>v===null||v<=0)||units.reduce((sum,v)=>sum+v,0)!==1000000)
     throw Error('Los destinos deben sumar exactamente 100 %, con porcentajes positivos (hasta cuatro decimales).');
   if(plan.length>16)throw Error('Máximo 16 destinos');
   return plan;
 }

 async function showDetectedHardware(force=false){
   const node=$('hardwareDevices');
   const editedCpu=node.querySelector('[data-cpu-percent]')?.value;
   const editedGpu=Object.fromEntries([...node.querySelectorAll('[data-gpu-identity]')].map(el=>[el.dataset.gpuIdentity,el.value]));
   hardwareInventory=null;
   node.textContent='Detectando hardware local…';
   $('saveMineSettings').disabled=true;
   try {
     const info=await api('/api/hardware'+(force?'?refresh=1':''));
     if(!$('hardwareDevices')||current.miner_network!==hardwareNetwork)return;
     hardwareInventory=info;
     const cpu=info.cpus||[],gpus=info.gpus||[];
     const css='hardware-device';
     const saved=s.gpu_identity_overrides||{};
     // El motor actual representa la CPU como un único dispositivo lógico.
     const cpuValue=editedCpu??(s.hardware_controls_v2?s.cpu_percent:0);
     const line=cpu.map(c=>`<div class="${css}"><span><strong>${esc(c.name)}</strong><small>CPU · ${esc(c.logical_threads)} hilos · Nativa</small></span><label class="hardware-value"><input class="input" type="number" min="0" max="100" step="1" value="${esc(cpuValue)}" data-cpu-percent aria-label="Porcentaje de ${esc(c.name)}"><span>%</span></label></div>`).join('');
     const gpuRows=gpus.map(g=>{
       const value=Object.prototype.hasOwnProperty.call(editedGpu,g.key)?editedGpu[g.key]:(Object.prototype.hasOwnProperty.call(saved,g.key)?saved[g.key]:25);
       return `<div class="${css}"><span><strong>${esc(g.name)}</strong><small>GPU · ${esc(g.backend?g.backend.toUpperCase():'Sin backend compatible')}</small></span>${g.supported?`<label class="hardware-value"><input class="input" type="number" min="0" max="100" step="1" value="${esc(value)}" data-gpu-identity="${esc(g.key)}" aria-label="Porcentaje de ${esc(g.name)}"><span>%</span></label>`:'<span class="hardware-state">Sin motor compatible</span>'}</div>`;
     }).join('');
     node.innerHTML=line+(gpuRows||'<p>No se detectaron GPU.</p>');
     $('saveMineSettings').disabled=cpu.length!==1;
   } catch(err){
     if($('hardwareDevices'))node.textContent='No se pudo detectar el hardware: '+err.message;
   }
 }

 $('logFontUp').onclick=()=>{logFontSize=Math.min(24,logFontSize+1);el.style.fontSize=logFontSize+'px';$('peerLog').style.fontSize=logFontSize+'px';updateLogButtons();scheduleLogViewSave()};
 $('logOlder').onclick=()=>act(loadOlderLog);
 $('logToEnd').onclick=()=>{el.scrollTop=el.scrollHeight;updateLogButtons();scheduleLogViewSave()};
 $('logCopyAll').onclick=()=>act(()=>downloadOriginalLog(false));
 $('logDownload').onclick=()=>act(()=>downloadOriginalLog(true));
 $('logSearchInput').oninput=()=>{lastSearchOffset=null};
 $('logSearchInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();act(()=>searchMinerLog(e.shiftKey))}};
 $('logSearchPrev').onclick=()=>act(()=>searchMinerLog(true));
 $('logSearchNext').onclick=()=>act(()=>searchMinerLog(false));
 $('logDelete').onclick=()=>act(deleteSelectedSession);
 $('logDeleteCancel').onclick=resetDeleteButton;
 $('logLimit').value=current?.settings?.log_max_mib??50;
 $('logSaveLimit').onclick=()=>act(async()=>{
  const mib=Number($('logLimit').value);if(!Number.isInteger(mib)||mib<1||mib>10240)throw Error('Límite entre 1 y 10240 MiB');
  await api('/api/settings',{log_max_mib:mib});
  const r=await api('/api/logs/prune',{});await loadLogSessions();
  notice('Límite actualizado. '+r.deleted.length+' sesiones antiguas eliminadas.'+(r.over_limit?' La sesión protegida excede el límite.':''));
 });
 sessionsLastRead=Date.now();await loadLogSessions();await updatePeerLog();
 if(restore&&selectedMinerLog===restore.name){
  // Después de que el modal aparece, restaurar la posición exacta de lectura.
  requestAnimationFrame(()=>{if($('minerLog')===el){el.scrollTop=restore.scroll;$('modalDialog').scrollTop=restore.panel_scroll||0;updateLogButtons()}});
 }else if(!restore){
  const saved=current?.settings?.log_view;
  if(saved?.name===selectedMinerLog&&saved.end>=saved.start&&saved.end>0&&saved.end-saved.start<=4*1024*1024){
   const r=await act(()=>api('/api/logs/chunk?name='+encodeURIComponent(selectedMinerLog)+'&mode=range&offset='+saved.start+'&end='+saved.end));
   if(r&&selectedMinerLog===saved.name){el.textContent=r.text;minerLogStart=r.start;minerLogEnd=r.cursor;
    requestAnimationFrame(()=>{if($('minerLog')===el){el.scrollTop=saved.scroll;$('modalDialog').scrollTop=saved.panel_scroll||0;updateLogButtons()}});scheduleLogViewSave()}
  }
 }
}
async function updateLogs(){if(!$('minerLog'))return;
 if(Date.now()-sessionsLastRead>5000){sessionsLastRead=Date.now();await loadLogSessions()}
 await readMoreLog();
}
async function tick(){try{
 await refresh();
 if($('explorerDetails')?.open){
  if($('knownPeersDetails')?.open&&Date.now()-peerTableLastAt>2400)await updatePeerTable();
  if($('peerActivityDetails')?.open)await updatePeerLog();
 }
 if($('logDetails')?.open)await updateLogs();
}catch(e){console.error(e)}}
CMFiat.init(api);
CMI18n.init();
// Credits open through Windows' default HTTPS browser, not our isolated app browser.
// The backend accepts no user-supplied URL for this action.
$('cashriderCredit').addEventListener('click',async event=>{
 event.preventDefault();
 try{await api('/api/external/cashrider',{});}
 catch(error){notice('No se pudo abrir CashRider en el navegador predeterminado: '+error.message,true)}
});
$('walletReceiveTab').addEventListener('click',()=>setMobileWalletAction('receive'));
$('walletSendTab').addEventListener('click',()=>setMobileWalletAction('send'));
setMobileWalletAction('receive');
$('viewWalletTab').addEventListener('click',()=>setMobileView('wallet'));
$('viewMinerTab').addEventListener('click',()=>setMobileView('miner'));
let balanceResizeFrame=0;
window.addEventListener('resize',()=>{
 if(balanceResizeFrame)cancelAnimationFrame(balanceResizeFrame);
 balanceResizeFrame=requestAnimationFrame(()=>{balanceResizeFrame=0;fitWalletBalances();});
});
window.CashMinerFiatError=e=>notice(e.message||String(e),true);
document.addEventListener('cashminer:fiat-changed',()=>{handleFiatCurrencyChange();if(current)draw()});
document.addEventListener('cashminer:fiat-updated',()=>{if(current)draw()});
document.addEventListener('cashminer:locale-changed',({detail})=>{
 if(sendUnitIsFiat()&&sendFiatSats!==null&&sendFiatQuote&&!sendMaxMode){$('sendAmount').value=CMFiat.fiatFromSats(sendFiatSats,sendFiatQuote);sendFiatInputValue=$('sendAmount').value}
 if(current)draw();
 if(!detail?.persist)return;
 const patch=detail.kind==='language'?{ui_language:detail.language}:{number_format:detail.numberFormat};
 act(async()=>{
   const previous=current?.settings||{};
   try{
     await api('/api/settings',patch);
     if(current?.settings)Object.assign(current.settings,patch);
   }catch(error){
     CMI18n.hydrate(previous.ui_language,previous.number_format);
     throw error;
   }
 });
});
act(async()=>{await refresh();timer=setInterval(()=>act(tick),2500)});
</script></body></html>
