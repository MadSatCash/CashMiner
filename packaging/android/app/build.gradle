plugins { id 'com.android.application'; id 'com.chaquo.python' }
layout.buildDirectory = file(System.getenv('CASHMINER_ANDROID_BUILD')+'/app')
android {
    namespace 'org.cashminer.android'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.cashminer.android'
        minSdk 24
        targetSdk 35
        versionCode 2170105
        versionName '2.17.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
    }
    signingConfigs {
        preview {
            storeFile file(System.getenv('CASHMINER_KEYSTORE'))
            storePassword System.getenv('CASHMINER_STORE_PASSWORD')
            keyAlias 'cashminer-preview'
            keyPassword System.getenv('CASHMINER_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.preview; minifyEnabled false } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1'; buildStagingDirectory file(System.getenv('CASHMINER_ANDROID_BUILD')+'/cxx') } }
    sourceSets { main { assets.srcDir System.getenv('CASHMINER_ANDROID_ASSETS'); res.srcDir System.getenv('CASHMINER_ANDROID_RES') } }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version '3.11'
        buildPython System.getenv('CASHMINER_BUILD_PYTHON')
        pip {
            options '--cache-dir', System.getenv('CASHMINER_ANDROID_BUILD')+'/pip-cache'
            install 'cryptography==42.0.8'
            install 'cffi==1.17.1'
            install 'pycparser==3.12'
            install 'chaquopy-libffi==3.3'
        }
    }
}
